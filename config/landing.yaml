# precision_land_node 的參數。
# 換相機、換 tag、換飛機都只要改這裡，不用動程式碼 —— 這是「拿去直接用」的關鍵。
/**:
  ros__parameters:
    # ---- 對象 ----------------------------------------------------------
    # PX4 的 namespace。多機時三台分別是 MAV1 / MAV2 / MAV3。
    namespace: "MAV1"

    # tag 位姿是相對這個 frame 算出來的，必須和 apriltag_node 收到的
    # camera_info 裡的 frame_id 一致，否則 tf2 查不到轉換。
    camera_frame: "camera_down_link"

    # ⚠️ 實測 drone_nav2_apriltag 那張貼圖解出來是 ID 0，不是拓樸圖的 node 10。
    #    這兩個是無關的編號系統，填錯不會報錯，只會永遠偵測不到。
    tag_id: 0

    # ⚠️ 這個值指的是「黑框外緣」的邊長，不是整張貼圖，也不是含靜區的地磚。
    #    已用 apriltag_node 實測確認：它回報的四個角就落在黑框外緣上。
    #    drone_nav2_apriltag 那張貼圖是 14x14 格、地磚 1.4 m（1 格 0.1 m），
    #    黑框佔中間 8 格（實測 896px 圖裡黑色範圍是 192~703），所以是 0.8 m。
    #    這個值錯了 ID 照樣讀得到，但距離會整個縮放 —— 最惡毒的一種 bug。
    tag_size: 0.8

    # ---- 相機安裝位置與角度 ---------------------------------------------
    # 直接抄 x500_nav2/model.sdf 裡 camera_down_link 的 <pose>：
    #     <pose>0 0 0.10 0 1.5707 0</pose>
    # 前三個是位置，後三個是 roll/pitch/yaw（弧度）。
    #
    # 座標慣例是 SDF 的機體系：x 前、y 左、z 上。
    # pitch +1.5707 把相機光軸（本體 +X）轉成朝下 -Z。
    #
    # ⚠️ test/t2_pose_check.py 會用「這裡的值」去換算，但探針的幾何是從
    #    model.sdf 生出來的 —— 兩邊不一致，T2 的位置檢查就會失敗。
    #    這是刻意的：抄錯數字比沒抄還危險，因為飛機會往偏掉的地方降。
    camera_offset: [0.0, 0.0, 0.10]
    camera_rpy:    [0.0, 1.5707, 0.0]

    # 這道指令要給哪一台飛機。單機 SITL 是 1，多機時第 N 台是 N+1。
    # 填錯的話 PX4 會安靜地忽略所有指令，飛機完全沒反應。
    target_system: 1

    # ---- 品質把關 ------------------------------------------------------
    # 黑白對比門檻。太低會把牆上的花紋讀成 tag，太高則逆光時完全鎖不上。
    min_decision_margin: 30.0

    # 連續幾幀都通過檢查才算「鎖定」。單幀誤判直接觸發降落太危險。
    lock_frames: 5

    # 連續幾幀沒看到才算「丟失」。設 1 的話偶爾掉一幀就會退回 SEARCHING，
    # 狀態機會一直抖。
    lost_frames: 15

    # ---- 判定門檻 ------------------------------------------------------
    xy_tolerance: 0.15          # 水平誤差小於這個才准開始下降（公尺）
    yaw_tolerance_deg: 5.0      # 航向誤差門檻（度）

    # ---- 控制增益 ------------------------------------------------------
    # 誤差乘以增益當速度指令。不要設 1.0：一次修到位會過衝然後來回震盪。
    kp_xy: 0.5
    kp_z: 0.6                   # 定高用，同樣不要設 1.0
    kp_yaw: 0.8
    max_speed_xy: 0.8           # 速度上限，防止離很遠時衝出去（m/s）
    max_yawspeed: 0.5           # rad/s
    descend_speed: 0.3          # 下降速度（m/s）

    # ---- 高度交接 ------------------------------------------------------
    # ⚠️ 降到這個高度就停止看 tag，改送 VEHICLE_CMD_NAV_LAND 交給 PX4。
    #    原因是幾何必然：下視相機 FOV 1.74 rad 配 1.0 m 的 tag，
    #    低於約 0.56 m 就整個出框，再低就永遠丟失、永遠落不了地。
    #    換相機或換 tag 尺寸時要重算這個數字。
    handoff_altitude: 1.0

    # ---- 逾時 ----------------------------------------------------------
    # 找不到 tag 不能無限等，電池會耗光。逾時就回報失敗讓上層決定要不要重試。
    search_timeout_s: 30.0
    total_timeout_s: 120.0

    # ---- 運作模式 ------------------------------------------------------
    # controller: 自己發 setpoint 接管飛機（預設）
    # advisor   : 只把誤差發到 ~/landing_error，完全不碰飛機。
    #             給已經有自己控制器、只想借用視覺定位的人用。
    control_mode: "controller"
